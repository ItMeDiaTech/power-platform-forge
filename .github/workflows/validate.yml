name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g --include=optional @anthropic-ai/claude-code@2.1.310
      - name: Validate plugin and marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: claude plugin validate --strict .
